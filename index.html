<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="dashboard-header">
      <p class="school-name">UNIVERSIDAD DE DAGUPAN</p>
      <p class="school-subtitle">SCHOOL OF INFORMATION TECHNOLOGY EDUCATION</p>
      <h1>Student Performance Dashboard</h1>
      <p class="description">Search, filter, and review student academic performance.</p>
    </header>

    <section class="controls" aria-label="Student filters">
      <div class="control-group">
        <label for="searchInput">Search Student</label>
        <input id="searchInput" type="text" placeholder="Enter student name">
      </div>

      <div class="control-group">
        <label for="blockFilter">Block</label>
        <select id="blockFilter">
          <option value="All">All</option>
          <option value="31-ITE-01">31-ITE-01</option>
          <option value="31-ITE-02">31-ITE-02</option>
          <option value="31-ITE-03">31-ITE-03</option>
        </select>
      </div>

      <div class="control-group">
        <label for="statusFilter">Academic Status</label>
        <select id="statusFilter">
          <option value="All">All</option>
          <option value="Excellent">Excellent</option> 
          <option value="Passed">Passed</option> 
          <option value="Needs Improvement">t</option> 
          <option value="Failed">Failed</option> 
        </select>
      </div>

      <div class="button-group">
        <button id="applyBtn" type="button">Apply Filters</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </section>

    <section class="summary" aria-label="Class summary">
      <div class="summary-card">
        <span class="summary-label">Class Average</span>
        <strong id="classAverage">0.00</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Passing Students</span>
        <strong id="passingCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Displayed Students</span>
        <strong id="displayedCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Top Student</span>
        <strong id="topStudent">None</strong>
      </div>
    </section>

    <div id="messageArea" class="message-area" aria-live="polite"></div>
    <section id="studentList" class="student-list" aria-label="Student records"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
